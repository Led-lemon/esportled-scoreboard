name: Feature request
description: Suggest an improvement or new scoreboard feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What production workflow, sport, output, or operator task should this improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sports rules
        - Control console
        - OBS/Resolume output
        - NDI desktop app
        - Sponsors/backgrounds
        - Stream Deck/MIDI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, broadcast references, or sport rules.
